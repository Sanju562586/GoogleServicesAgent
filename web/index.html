<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Services AI Agent</title>
  <meta name="description" content="AI-powered personal assistant with live access to Gmail, Drive, Calendar, Photos, Tasks and Contacts." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" />
  <link rel="stylesheet" href="/static/style.css" />

  <!--
    importmap: maps bare module names to ESM CDN URLs.
    Must appear before any type="module" script.
  -->
  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.3.1",
      "react-dom":        "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion":    "https://esm.sh/framer-motion@11.18.2?deps=react@18.3.1,react-dom@18.3.1",
      "/":                "https://esm.sh/"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    marked + hljs loaded as classic scripts (sync) so window.marked / window.hljs
    are available by the time the deferred ES module runs.
  -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- App: native ES module, no Babel or transpilation needed -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
